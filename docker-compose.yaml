services:
  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    ports:
      - 6379:6379
    volumes:
      # Formato: [caminho_no_servidor]:[caminho_no_conteiner]
      - ./redis:/data
    # Desativa o usuário "default" e cria um usuário ACL com senha (lidos do .env)
    command: >
      redis-server
      --appendonly yes
      --user default off
      --user ${REDIS_USER} on >${REDIS_PASSWORD} ~* &* +@all

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    restart: always
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=${REDIS_USER}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - 16379:8081
    depends_on:
      - redis
